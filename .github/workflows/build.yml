name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compiler
        run: gradle assembleRelease --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk ClioHome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClioHome-apk
          path: ClioHome.apk
      - name: Publier la dernière version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Clio Home (dernière version)
          body: "APK construit automatiquement depuis la branche main. Téléchargez ClioHome.apk ci-dessous."
          files: ClioHome.apk
          make_latest: true
